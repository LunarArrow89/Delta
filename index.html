<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17191f">
  <title>Delta — Tiny Game Engine</title>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">DELTA<span>LANG</span></a>
    <div class="top-actions">
      <input id="projectName" class="project-name" aria-label="Project name" value="My Delta Project" maxlength="40">
      <button id="saveProjectButton" class="quiet-button" type="button">Save</button>
      <select id="projectSelect" class="project-select" aria-label="Saved projects"><option value="">Saved projects…</option></select>
      <button id="resetButton" class="quiet-button" type="button">New</button>
      <button id="runButton" class="run-button" type="button">▶ Run in window</button>
    </div>
  </header>


  <main class="workspace" id="workspace">
    <aside class="files-panel" aria-label="Project files">
      <div class="files-heading"><span>FILES</span><button id="addFileButton" type="button" aria-label="Add file" title="Add file">+</button></div>
      <div id="fileList" class="file-list">
        <div class="file-row"><button class="file-item active" type="button" data-file="main.delta"><span class="file-icon delta-icon">◆</span> main.delta</button></div>
      </div>
      <p class="files-note">File connections coming soon</p>
    </aside>
    <section class="editor-panel">
      <div class="panel-heading">
        <div><span class="status-dot"></span> <span>main.delta</span></div>
        <span class="panel-note">DELTA LANGUAGE</span>
      </div>
      <div class="editor-wrap">
        <div id="lineNumbers" class="line-numbers" aria-hidden="true">1</div>
        <pre id="highlightLayer" class="highlight-layer" aria-hidden="true"></pre>
        <textarea id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Delta code editor"></textarea>
      </div>
      <div class="editor-footer"><span id="saveStatus">Autosaved in this browser</span><span id="cursorInfo">Line 1</span></div>
    </section>

    <section class="output-panel">
      <div class="panel-heading">
        <span>Output</span>
        <button id="clearButton" class="text-button" type="button">Clear</button>
      </div>
      <div id="output" class="output" role="log" aria-live="polite"><p class="placeholder">Press Run in window to execute your Delta program.</p></div>
      <div class="output-footer"><span id="runStatus">Ready</span><span>Delta playground</span></div>
    </section>

  </main>
  <script src="app.js?v=37"></script>
</body>
</html>
